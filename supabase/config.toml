# Supabase local development configuration
# See: https://supabase.com/docs/guides/cli/config
#
# This file configures the LOCAL Supabase development environment only.
# Production project settings are managed in the Supabase dashboard.
#
# Never put production credentials or service-role keys in this file.

[api]
# Port for the local REST API (PostgREST)
port = 54321
# Port for the local database
db_port = 54322
# Port for the local Studio UI
studio_port = 54323

[db]
# Postgres version for the local development database
major_version = 15

[auth]
# Local auth server port
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3001",
]
# JWT expiry (seconds)
jwt_expiry = 3600
# Enable email confirmations in local dev (set to false to skip confirmation)
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your evrry security code is {{ .Code }}. Valid for 10 minutes."

# Whitelisted test phone numbers with fixed OTP (bypasses live SMS for dev)
[auth.sms.test_otp]
"+9779800000001" = "123456"
"+9779800000002" = "123456"
"+9779800000003" = "123456"

[storage]
# Maximum file upload size (bytes)
file_size_limit = "50MiB"

[functions]
# Deno version used for Edge Functions in local dev
# deno_version = "1.x"
